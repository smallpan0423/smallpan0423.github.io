<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Welcome</title>
  <style>
    /* ---- 基本底色與字體 ---- */
    :root{
      --bg: #d6d0ff;       /* 淡紫底，接近截圖 */
      --ink: #1f1f1f;      /* 內文深灰 */
      --link: #6a41ff;     /* 連結/標題藍紫 */
      --maxw: 900px;       /* 內容最大寬度（截圖看起來 ~900-1000px） */
    }
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC",
                   "Hiragino Sans GB", "Microsoft JhengHei", Arial, sans-serif;
      line-height:1.85;
    }

    /* ---- 置中內容欄 ---- */
    .wrap{
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 28px 18px 80px;
    }

    /* ---- 頁首大標 ---- */
    h1{
      margin: 8px 0 22px;
      text-align: center;
      color: var(--link);
      font-weight: 800;
      font-size: clamp(2.2rem, 5.6vw, 3.2rem); /* 手機到桌機自適應，接近截圖大小 */
      letter-spacing: .5px;
    }

    /* ---- 內文段落 ---- */
    p{margin: 1.0rem 0;}
    a{
      color: var(--link);
      text-underline-offset: 2px;
    }
    a:hover{ text-decoration-thickness: 2px; }

    /* ---- 強調的紫色粗體（Jobs for students!） ---- */
    .accent{
      color: var(--link);
      font-weight: 800;
    }

    /* ---- 簽名靠右 ---- */
    .sig{
      text-align: right;
      margin: 1.2rem 0 1.6rem;
      font-weight: 600;
    }

    /* ---- 大圖 ---- */
    .hero{
      display:block;
      width:100%;
      height:auto;
      border: 0;
      /* 截圖中圖像是完整矩形，無圓角陰影 */
    }

    /* ---- 讓桌機的文字寬度更像截圖（約 60-70 字元） ---- */
    .text{
      max-width: 1000px;   /* 控制段落行長，貼近示意頁 */
      margin: 0 auto;     /* 在 wrap 內再置中，讓左右留白更像截圖 */
      font-size: 1.0rem; /* 微調字級接近瀏覽器預設下的視覺比例 */
    }

    /* 小螢幕排版微調 */
    @media (max-width: 560px){
      .text{max-width: 100%;}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Welcome</h1>

    <div class="text">
      <p>
        <!-- I am a theoretical physicist, photographer and amateur astronomer. -->
      </p>

      <p>
        <!-- I am Professor at the National Central University (NCU)
        <a href="#" target="_blank" rel="noopener">Department of Physics</a> in Taoyuan, Taiwan; and a
        member of its <a href="#" target="_blank" rel="noopener">Fundamental Physics Group</a> and
        <a href="#" target="_blank" rel="noopener">Center for High Field and High Energy Physics</a>.
        I am also an adjunct faculty at NCU's
        <a href="#" target="_blank" rel="noopener">Graduate Institute of Astronomy</a>. -->
      </p>

      <p>
        xx
        <!-- <a href="#" target="_blank" rel="noopener">Wolfram Language</a> software development.
        You can find my publications <a href="#" target="_blank" rel="noopener">here</a> or
        <a href="#" target="_blank" rel="noopener">here</a>; or, check out my
        <a href="#" target="_blank" rel="noopener">Google Scholar Profile</a>.
        In my free time, which is somewhat ephemeral, I bring out my camera(s) for a shoot. -->
      </p>

      <p>
        <!-- <span class="accent">Jobs for students!</span>
        I am looking for undergrad and graduate students to help me build and expand my
        <a href="#" target="_blank" rel="noopener">TensoriaCalc</a> differential geometry package.
        See ad <a href="#" target="_blank" rel="noopener">here</a>. -->
      </p>

      <p class="sig">- Cin-Hua</p>
    </div>

    <!-- Hero 圖片：把 src 換成你的圖片路徑 -->
    <img class="hero" src="images/your-hero.jpg" alt="Landscape photo" />
  </div>
</body>
</html>
